<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0508">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Adviento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <header class="top">
      <h1 id="titulo"></h1>
      <p id="countdown"></p>
    </header>
    <div class="grid" id="grid"></div>
  </main>

  <section class="viewer" id="viewer" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="vbar">
      <span id="viewerNum"></span>
      <button id="close" type="button">Cerrar</button>
    </div>
    <div class="vbody" id="viewerBody"></div>
  </section>

  <section class="intro" id="intro">
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
    <button id="introBtn" type="button" class="btn"></button>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
